<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinyl Wav Player - Premium Audio Experience</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --player-bg: #1e1e1e;
            --accent-color: #d4af37;
            /* Metallic Gold */
            --vinyl-black: #0c0c0c;
            --text-color: #e0e0e0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --transition-speed: 0.5s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
        }

        /* Container */
        .player-container {
            position: relative;
            width: 900px;
            height: 600px;
            background: var(--player-bg);
            border-radius: 20px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.02);
            display: flex;
            padding: 40px;
            gap: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Left side: Turntable */
        .turntable {
            flex: 1.5;
            position: relative;
            background: #151515;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.03);
            overflow: hidden;
        }

        /* Vinyl Record */
        .vinyl-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .vinyl {
            width: 380px;
            height: 380px;
            background: repeating-radial-gradient(circle at center,
                    #0c0c0c 0,
                    #111 2px,
                    #0c0c0c 4px);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 0, 0, 0.5);
            transition: transform var(--transition-speed) linear;
            cursor: pointer;
        }

        .vinyl::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #d4af37, #f1c40f);
            border-radius: 50%;
            z-index: 1;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .vinyl::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #222;
            border-radius: 50%;
            z-index: 2;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .vinyl-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #000;
            font-weight: 600;
            font-size: 10px;
            padding: 10px;
            pointer-events: none;
        }

        .vinyl.spinning {
            animation: rotateRecord 1.81s linear infinite;
            /* ~33.3 RPM */
        }

        @keyframes rotateRecord {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Tonearm */
        .tonearm {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 10px;
            height: 250px;
            background: linear-gradient(to bottom, #777, #333);
            border-radius: 5px;
            transform-origin: top center;
            transform: rotate(-30deg);
            transition: transform 1s cubic-bezier(0.445, 0.05, 0.55, 0.95);
            z-index: 10;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
        }

        .tonearm::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: -5px;
            width: 20px;
            height: 40px;
            background: #222;
            border-radius: 2px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .tonearm.playing {
            transform: rotate(5deg);
        }

        /* Right side: Controls */
        .controls-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-style: italic;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .track-info {
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .track-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.9rem;
            opacity: 0.6;
            margin-bottom: 15px;
        }

        /* Custom File Input */
        .file-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }

        .custom-file-btn:hover {
            transform: translateY(-2px);
            background: #e5c048;
        }

        /* Audio Controls */
        .main-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: scale(1.1);
        }

        .btn.play-pause {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.05);
            font-size: 1.5rem;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        input[type="range"] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Visualizer */
        .visualizer {
            height: 40px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            margin-top: 20px;
        }

        .bar {
            flex: 1;
            background: var(--accent-color);
            height: 2px;
            transition: height 0.1s ease;
            opacity: 0.5;
        }

        /* Status Light */
        .status-light {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            margin-right: 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .status-active {
            background: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.7);
        }
    </style>
</head>

<body>

    <div class="player-container">
        <!-- Turntable Section -->
        <div class="turntable">
            <div class="vinyl-wrapper">
                <div class="vinyl" id="vinyl">
                    <div class="vinyl-label">
                        <div id="labelTrack">ANTIGRAVITY</div>
                        <div id="labelArtist">PREMIUM SOUND</div>
                    </div>
                </div>
            </div>
            <div class="tonearm" id="tonearm"></div>
        </div>

        <!-- Controls Section -->
        <div class="controls-panel">
            <div>
                <h1>Yane Player</h1>
                <p style="opacity: 0.5; font-size: 0.8rem; margin-bottom: 20px;">VINTAGE STYLE DIGITAL PLAYER</p>
            </div>

            <div class="track-info">
                <div class="track-name" id="trackName">No File Selected</div>
                <div class="track-artist" id="trackArtist">Please load a .wav file</div>

                <div class="visualizer" id="visualizer">
                    <!-- Bars will be generated by JS -->
                </div>
            </div>

            <div class="file-input-wrapper">
                <label for="audioFile" class="custom-file-btn">LOAD .WAV RECORD</label>
                <input type="file" id="audioFile" accept=".wav">
            </div>

            <div class="main-controls">
                <button class="btn" id="stopBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" />
                    </svg>
                </button>
                <button class="btn play-pause" id="playPauseBtn">
                    <span id="playIcon">▶</span>
                </button>
                <div style="display: flex; align-items: center; margin-left: auto;">
                    <div class="status-light" id="statusLight"></div>
                    <span id="statusText" style="font-size: 0.8rem; opacity: 0.6;">IDLE</span>
                </div>
            </div>

            <div class="volume-control">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="opacity: 0.5;">
                    <path
                        d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const audioFile = document.getElementById('audioFile');
        const audioPlayer = document.getElementById('audioPlayer');
        const vinyl = document.getElementById('vinyl');
        const tonearm = document.getElementById('tonearm');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const playIcon = document.getElementById('playIcon');
        const trackNameDisplay = document.getElementById('trackName');
        const trackArtistDisplay = document.getElementById('trackArtist');
        const labelTrack = document.getElementById('labelTrack');
        const volumeSlider = document.getElementById('volumeSlider');
        const statusLight = document.getElementById('statusLight');
        const statusText = document.getElementById('statusText');
        const visualizerContainer = document.getElementById('visualizer');

        let audioContext;
        let analyser;
        let source;
        const barCount = 30;
        const bars = [];

        // Create visualizer bars
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            visualizerContainer.appendChild(bar);
            bars.push(bar);
        }

        // Initialize Audio Context on user interaction
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaElementSource(audioPlayer);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 64;
                animateVisualizer();
            }
        }

        function animateVisualizer() {
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            for (let i = 0; i < barCount; i++) {
                const value = dataArray[i % dataArray.length];
                const height = (value / 255) * 40;
                bars[i].style.height = `${Math.max(2, height)}px`;
                bars[i].style.opacity = 0.3 + (value / 255) * 0.7;
            }
            requestAnimationFrame(animateVisualizer);
        }

        audioFile.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audioPlayer.src = url;
                trackNameDisplay.textContent = file.name;
                labelTrack.textContent = file.name.substring(0, 15).toUpperCase();
                trackArtistDisplay.textContent = "Digital Vinyl Rip";

                // Reset states
                stopPlayback();
            }
        });

        function startVisuals() {
            vinyl.classList.add('spinning');
            tonearm.classList.add('playing');
            playIcon.textContent = '⏸';
            statusLight.classList.add('status-active');
            statusText.textContent = 'PLAYING';
        }

        async function playAudioWithDelay() {
            initAudio();
            if (!audioPlayer.src) {
                alert("Please load a .wav file first!");
                return;
            }

            // 1. Initial visual triggers (tonearm starts moving)
            vinyl.classList.add('spinning');
            tonearm.classList.add('playing');
            playIcon.textContent = '⏸';
            statusText.textContent = 'SETTING NEEDLE...';

            // 2. Wait for tonearm animation (1s in CSS) + tiny extra for "contact"
            await new Promise(resolve => setTimeout(resolve, 1100));

            // 3. Start audio and update status
            try {
                // Slight volume ramp for realism if needed, but simple play for now
                await audioPlayer.play();
                statusLight.classList.add('status-active');
                statusText.textContent = 'PLAYING';
            } catch (err) {
                console.error("Playback failed:", err);
                stopPlayback();
            }
        }

        playPauseBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                playAudioWithDelay();
            } else {
                audioPlayer.pause();
                pauseVisuals();
            }
        });

        stopBtn.addEventListener('click', () => {
            stopPlayback();
        });

        audioPlayer.addEventListener('ended', () => {
            stopPlayback();
        });

        volumeSlider.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value;
        });

        function pauseVisuals() {
            vinyl.classList.remove('spinning');
            // We keep the tonearm in place during pause for realism, 
            // but in this UI let's keep it playing style or move it back?
            // Usually, tonearm stays on record during pause.
            playIcon.textContent = '▶';
            statusText.textContent = 'PAUSED';
            statusLight.classList.remove('status-active');
        }

        function stopPlayback() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            vinyl.classList.remove('spinning');
            tonearm.classList.remove('playing');
            playIcon.textContent = '▶';
            statusLight.classList.remove('status-active');
            statusText.textContent = 'STOPPED';
        }

        // Vinyl click shortcut
        vinyl.addEventListener('click', () => playPauseBtn.click());

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                playPauseBtn.click();
            }
        });

    </script>
</body>

</html>
